# kill_window = "cmd+option+q"
# copy = "cmd+c"
# paste = "cmd+v"
# toggle_filter = "cmd+f"
# toggle_bookmark = "cmd+b"
# toggle_anchor = "cmd+shift+a"
# focus_anchor = "cmd+a"
# prev_tab = "cmd+shift+["
# next_tab = "cmd+shift+]"
# rename_tab = "cmd+shift+r"
# detach_tab = "cmd+shift+t"

